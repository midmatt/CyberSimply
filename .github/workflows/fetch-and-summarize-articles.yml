# actionlint: disable=expression
name: Summarize Articles (AI only)

on:
  schedule:
    - cron: "30 5 * * *"  # Runs daily at 05:30 UTC, after fetch job
  workflow_dispatch:

jobs:
  summarize:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        run: |
          set -euo pipefail
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          corepack enable

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Summarize stored articles
        run: |
          set -euo pipefail
          # Missing secrets are a misconfiguration, not a reason to report green.
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::Supabase secrets are not set."
            exit 1
          fi

          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set."
            exit 1
          fi

          node summarize-articles.mjs

      # Separate from the per-run pass/fail above: this asserts the data is
      # actually fresh, catching the case where runs are green but nothing new
      # is arriving.
      - name: Check pipeline freshness
        run: node health-check.mjs

      - name: Alert on failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          echo "### ❌ Summarize Articles failed" >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${ALERT_WEBHOOK_URL:-}" ]; then
            echo "No ALERT_WEBHOOK_URL secret set; skipping webhook notification."
            exit 0
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MSG="🚨 CyberSimply: '${GITHUB_WORKFLOW}' failed. Articles may be unsummarized or stale. ${RUN_URL}"
          echo "Alert message: ${MSG}"

          # 'text' is Slack's field, 'content' is Discord's; each ignores the other,
          # so one secret works with either provider.
          # Capture the status: a bare `curl -sS` exits 0 even when the provider
          # rejects the payload, which would make the alerting itself fail silently.
          HTTP_CODE=$(jq -n --arg m "$MSG" '{text: $m, content: $m}' \
            | curl -sS -o /tmp/alert-response.txt -w '%{http_code}' \
                -X POST -H 'Content-Type: application/json' -d @- "$ALERT_WEBHOOK_URL")

          echo "Webhook HTTP status: ${HTTP_CODE}"
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::Alert webhook rejected the message (HTTP ${HTTP_CODE})"
            cat /tmp/alert-response.txt || true
          else
            echo "✅ Alert delivered (HTTP ${HTTP_CODE})."
          fi

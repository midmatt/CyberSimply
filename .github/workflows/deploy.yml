name: Deploy website to GitHub Pages

# The site is a static export of the Next.js app in web/. Article data is read
# from Supabase at build time, so the site is rebuilt after each article-fetch
# run as well as on push, otherwise the feed would freeze at the last deploy.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_run:
    workflows: ["Fetch Articles (store only)", "Summarize Articles (AI only)"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        if [ ! -d .git ]; then
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
        fi
        git fetch --depth=1 origin "${GITHUB_SHA}"
        git checkout --force "${GITHUB_SHA}"

    - name: Setup Node.js 20
      run: |
        set -euo pipefail
        curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
        sudo apt-get install -y nodejs

    - name: Install web dependencies
      working-directory: web
      run: npm ci

    - name: Build static site
      working-directory: web
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      run: npm run build

    - name: Deploy to GitHub Pages
      if: github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
          echo "Deployment only runs on main branch. Current ref: ${GITHUB_REF}"
          exit 0
        fi

        # -d is the directory published to the branch root. The previous
        # workflow passed only --dest, which left the dist directory unset.
        npx --yes gh-pages@6.0.0 \
          --dotfiles \
          --message "Deploy website" \
          -d web/out \
          --branch gh-pages \
          --repo "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
          --cname cybersimply.com
